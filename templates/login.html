{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="card">

  <h1>Login</h1>
      
  <p>Use a dummy account to test the login system.</p>

  <!-- Send the username and password to Flask -->

  <form method="POST">

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>

    </form>

    <!-- Show a login error if Flask sends one -->
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>

{% endblock %}
